name = "basic-budgeting"
pages_build_output_dir = "public"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Set TURSO_DATABASE_URL and TURSO_AUTH_TOKEN as secrets via:
#   wrangler pages secret put TURSO_DATABASE_URL
#   wrangler pages secret put TURSO_AUTH_TOKEN
# For local dev, copy .dev.vars.example to .dev.vars and fill in values.

