<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Stats</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Budget Tracker</h1>
    <nav>
      <a href="/">Expenditures</a>
      <a href="/stats.html" class="active">Stats</a>
    </nav>
  </header>

  <main>
    <div class="charts-grid">
      <div class="card">
        <h2>Spending by Month</h2>
        <div class="chart-wrap">
          <canvas id="monthChart"></canvas>
        </div>
      </div>
      <div class="card">
        <h2>Spending by Place</h2>
        <div class="chart-wrap">
          <canvas id="placeChart"></canvas>
        </div>
      </div>
    </div>
  </main>

  <script>
    const PALETTE = [
      '#3b82f6', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6',
      '#06b6d4', '#f97316', '#84cc16', '#ec4899', '#6366f1',
    ];

    async function loadStats() {
      let data;
      try {
        const res = await fetch('/api/stats');
        if (!res.ok) throw new Error(res.statusText);
        data = await res.json();
      } catch (err) {
        document.querySelector('main').innerHTML =
          `<div class="card"><p class="empty">Failed to load stats: ${err.message}</p></div>`;
        return;
      }

      // Spending by Month — bar chart
      new Chart(document.getElementById('monthChart'), {
        type: 'bar',
        data: {
          labels: data.byMonth.map((d) => d.month),
          datasets: [{
            label: 'Total Spent ($)',
            data: data.byMonth.map((d) => d.total),
            backgroundColor: '#3b82f6',
            borderRadius: 4,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: (v) => '$' + v.toLocaleString(),
              },
            },
          },
        },
      });

      // Spending by Place — doughnut chart
      new Chart(document.getElementById('placeChart'), {
        type: 'doughnut',
        data: {
          labels: data.byPlace.map((d) => d.place),
          datasets: [{
            data: data.byPlace.map((d) => d.total),
            backgroundColor: PALETTE.slice(0, data.byPlace.length),
            hoverOffset: 6,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { boxWidth: 12, padding: 12, font: { size: 12 } },
            },
            tooltip: {
              callbacks: {
                label: (ctx) => ` $${Number(ctx.raw).toFixed(2)}`,
              },
            },
          },
        },
      });
    }

    loadStats();
  </script>
</body>
</html>
